<svg width="800" height="1100" viewBox="0 0 800 1100" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SecureMark5G Protocol Flow — Corrected</title>
  <desc>Step-by-step protocol showing watermark embedding, BLAKE3 token generation, ChaCha20 encryption, 5G transmission, and server-side verification with attack detection branches</desc>
  
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2C0B6" />
    </marker>
    <marker id="arrowhead-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F09595" />
    </marker>
    <marker id="arrowhead-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97C459" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="1100" fill="#0D0D18" rx="12"/>

  <!-- Sidebar: Rust Crate -->
  <rect x="20" y="100" width="180" height="350" rx="8" fill="none" stroke="#3A3858" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="110" y="90" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="13">Rust core engine</text>
  <g font-family="JetBrains Mono, monospace" font-size="14" fill="#6B6980" text-anchor="middle">
    <text x="110" y="140">watermark.rs</text>
    <text x="110" y="165">auth.rs</text>
    <text x="110" y="190">crypto.rs</text>
    <text x="110" y="215">replay.rs</text>
    <text x="110" y="240">lib.rs (PyO3)</text>
    <text x="110" y="290" fill="#4B4870" font-size="12">zero-copy</text>
    <text x="110" y="310" fill="#4B4870" font-size="12">pipeline</text>
    <text x="110" y="335" fill="#4B4870" font-size="12">~12µs latency</text>
  </g>

  <!-- Step 1: IoT Device -->
  <rect x="250" y="30" width="400" height="75" rx="10" fill="#085041" stroke="#5DCAA5" stroke-width="1.5"/>
  <text x="450" y="60" text-anchor="middle" fill="#9FE1CB" font-family="JetBrains Mono, monospace" font-size="20" font-weight="600">IoT device boots</text>
  <text x="450" y="85" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="14">generates sensor data + metadata</text>
  
  <line x1="450" y1="105" x2="450" y2="138" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Watermark -->
  <rect x="250" y="140" width="400" height="75" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1.5"/>
  <text x="450" y="170" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">LSB watermark embed</text>
  <text x="450" y="195" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="14">device fingerprint in float LSBs</text>

  <line x1="450" y1="215" x2="450" y2="248" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: BLAKE3 -->
  <rect x="250" y="250" width="400" height="90" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1.5"/>
  <text x="450" y="280" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">BLAKE3 token generation</text>
  <text x="450" y="305" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="14">token = BLAKE3(data ‖ wm ‖ nonce)</text>
  <text x="450" y="325" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="14">timestamp nonce prevents replay</text>

  <line x1="450" y1="340" x2="450" y2="378" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 4: ChaCha20 -->
  <rect x="250" y="380" width="400" height="75" rx="10" fill="#712B13" stroke="#F0997B" stroke-width="1.5"/>
  <text x="450" y="410" text-anchor="middle" fill="#F5C4B3" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">ChaCha20-Poly1305 encrypt</text>
  <text x="450" y="435" text-anchor="middle" fill="#F0997B" font-family="JetBrains Mono, monospace" font-size="14">authenticated encryption (AEAD)</text>

  <line x1="450" y1="455" x2="450" y2="498" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 5: 5G channel -->
  <rect x="180" y="500" width="540" height="90" rx="10" fill="#18182A" stroke="#4B4870" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="535" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="20" font-weight="600">5G transmission channel</text>
  <text x="450" y="565" text-anchor="middle" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="14">encrypted packet — replay / tamper possible</text>

  <line x1="450" y1="590" x2="450" y2="628" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 6: Decrypt -->
  <rect x="250" y="630" width="400" height="75" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="1.5"/>
  <text x="450" y="660" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">ChaCha20 decrypt (server)</text>
  <text x="450" y="685" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="14">AEAD tag verified; plaintext recovered</text>

  <line x1="450" y1="705" x2="450" y2="738" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 7: Timestamp check -->
  <rect x="250" y="740" width="400" height="75" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="1.5"/>
  <text x="450" y="770" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">Replay window check</text>
  <text x="450" y="795" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="14">|now − timestamp| &lt; 30s → proceed</text>

  <!-- Branch: Replay Rejected -->
  <line x1="650" y1="778" x2="700" y2="778" stroke="#712B13" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <rect x="702" y="755" width="80" height="45" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="1"/>
  <text x="742" y="783" text-anchor="middle" fill="#F7C1C1" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">REPLAY</text>

  <line x1="450" y1="815" x2="450" y2="848" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 8: Watermark extract -->
  <rect x="250" y="850" width="400" height="75" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1.5"/>
  <text x="450" y="880" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">Watermark extraction</text>
  <text x="450" y="905" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="14">extract LSB fingerprint; verify integrity</text>

  <!-- Branch: Tamper Detected -->
  <line x1="650" y1="888" x2="700" y2="888" stroke="#712B13" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <rect x="702" y="865" width="80" height="45" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="1"/>
  <text x="742" y="893" text-anchor="middle" fill="#F7C1C1" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">TAMPER</text>

  <line x1="450" y1="925" x2="450" y2="958" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 9: BLAKE3 verify -->
  <rect x="250" y="960" width="400" height="75" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="1.5"/>
  <text x="450" y="990" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">BLAKE3 token verify</text>
  <text x="450" y="1015" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="14">recompute token; check against payload</text>

  <!-- Final Split -->
  <line x1="450" y1="1035" x2="450" y2="1050" stroke="#3A3858" stroke-width="2"/>
  <line x1="330" y1="1050" x2="570" y2="1050" stroke="#3A3858" stroke-width="2"/>
  
  <line x1="330" y1="1050" x2="330" y2="1065" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="570" y1="1050" x2="570" y2="1065" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead-red)"/>

  <!-- Step 10: Result -->
  <rect x="230" y="1065" width="200" height="30" rx="8" fill="#27500A" stroke="#97C459" stroke-width="1.5"/>
  <text x="330" y="1086" text-anchor="middle" fill="#C0DD97" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">AUTHENTICATED</text>

  <rect x="470" y="1065" width="200" height="30" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="1.5"/>
  <text x="570" y="1086" text-anchor="middle" fill="#F7C1C1" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">REJECTED</text>
</svg>
