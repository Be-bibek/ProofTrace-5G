<svg width="680" height="920" viewBox="0 0 680 920" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SecureMark5G Protocol Flow — Corrected</title>
  <desc>Step-by-step protocol showing watermark embedding, BLAKE3 token generation, ChaCha20 encryption, 5G transmission, and server-side verification with attack detection branches</desc>
  
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2C0B6" />
    </marker>
    <marker id="arrowhead-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F09595" />
    </marker>
    <marker id="arrowhead-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97C459" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="920" fill="#0D0D18" rx="12"/>

  <!-- Sidebar: Rust Crate -->
  <rect x="20" y="100" width="160" height="300" rx="8" fill="none" stroke="#3A3858" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="100" y="90" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="11">Rust crate runs here</text>
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#6B6980" text-anchor="middle">
    <text x="100" y="130">watermark.rs</text>
    <text x="100" y="150">auth.rs</text>
    <text x="100" y="170">crypto.rs</text>
    <text x="100" y="190">replay.rs</text>
    <text x="100" y="210">pyo3_bindings.rs</text>
    <text x="100" y="250" fill="#4B4870" font-size="10">zero-copy pipeline</text>
    <text x="100" y="268" fill="#4B4870" font-size="10">~microsecond</text>
    <text x="100" y="286" fill="#4B4870" font-size="10">latency per packet</text>
  </g>

  <!-- Step 1: IoT Device -->
  <rect x="200" y="20" width="300" height="60" rx="10" fill="#085041" stroke="#5DCAA5" stroke-width="1.5"/>
  <text x="350" y="45" text-anchor="middle" fill="#9FE1CB" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">IoT device boots</text>
  <text x="350" y="65" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="11">device_id, secret_key, sensor_data generated</text>
  
  <line x1="350" y1="80" x2="350" y2="108" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Watermark -->
  <rect x="200" y="110" width="300" height="60" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1.5"/>
  <text x="350" y="135" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">LSB watermark embed (watermark.rs)</text>
  <text x="350" y="155" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="11">device fingerprint hidden in sensor float bits</text>

  <line x1="350" y1="170" x2="350" y2="198" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: BLAKE3 -->
  <rect x="200" y="200" width="300" height="70" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1.5"/>
  <text x="350" y="225" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BLAKE3 token generation (auth.rs)</text>
  <text x="350" y="245" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="11">token = BLAKE3(data ‖ watermark ‖ nonce ‖ ts)</text>
  <text x="350" y="260" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="11">timestamp nonce prevents replay attacks</text>

  <line x1="350" y1="270" x2="350" y2="298" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 4: ChaCha20 -->
  <rect x="200" y="300" width="300" height="60" rx="10" fill="#712B13" stroke="#F0997B" stroke-width="1.5"/>
  <text x="350" y="325" text-anchor="middle" fill="#F5C4B3" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">ChaCha20-Poly1305 encrypt (crypto.rs)</text>
  <text x="350" y="345" text-anchor="middle" fill="#F0997B" font-family="JetBrains Mono, monospace" font-size="11">ciphertext = ChaCha20({data+wm+token}, key)</text>

  <line x1="350" y1="360" x2="350" y2="388" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 5: 5G channel -->
  <rect x="130" y="390" width="440" height="70" rx="10" fill="#18182A" stroke="#4B4870" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="350" y="415" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">5G transmission channel</text>
  <text x="350" y="435" text-anchor="middle" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="11">encrypted packet in flight — replay / tamper possible here</text>
  <text x="350" y="450" text-anchor="middle" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="11">simulated by channel_sim.py during testing</text>

  <line x1="350" y1="460" x2="350" y2="488" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 6: Decrypt -->
  <rect x="200" y="490" width="300" height="60" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="1.5"/>
  <text x="350" y="515" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">ChaCha20 decrypt (server)</text>
  <text x="350" y="535" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="11">plaintext recovered; AEAD tag verified</text>

  <line x1="350" y1="550" x2="350" y2="578" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 7: Timestamp check -->
  <rect x="200" y="580" width="300" height="60" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="1.5"/>
  <text x="350" y="605" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">Replay window check (replay.rs)</text>
  <text x="350" y="625" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="11">|now − timestamp| &lt; 30s → continue</text>

  <!-- Branch: Replay Rejected -->
  <line x1="500" y1="610" x2="560" y2="610" stroke="#712B13" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="530" y="605" text-anchor="middle" fill="#F09595" font-family="JetBrains Mono, monospace" font-size="10">expired</text>
  <rect x="562" y="590" width="100" height="40" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="1"/>
  <text x="612" y="610" text-anchor="middle" fill="#F7C1C1" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">Replay</text>
  <text x="612" y="624" text-anchor="middle" fill="#F09595" font-family="JetBrains Mono, monospace" font-size="10">rejected</text>

  <line x1="350" y1="640" x2="350" y2="668" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 8: Watermark extract -->
  <rect x="200" y="670" width="300" height="60" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1.5"/>
  <text x="350" y="695" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">Watermark extraction (watermark.rs)</text>
  <text x="350" y="715" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="11">extract LSB fingerprint; compare to registry</text>

  <!-- Branch: Tamper Detected -->
  <line x1="500" y1="700" x2="560" y2="700" stroke="#712B13" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="530" y="695" text-anchor="middle" fill="#F09595" font-family="JetBrains Mono, monospace" font-size="10">mismatch</text>
  <rect x="562" y="680" width="100" height="40" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="1"/>
  <text x="612" y="700" text-anchor="middle" fill="#F7C1C1" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">Tamper</text>
  <text x="612" y="714" text-anchor="middle" fill="#F09595" font-family="JetBrains Mono, monospace" font-size="10">detected</text>

  <line x1="350" y1="730" x2="350" y2="758" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 9: BLAKE3 verify -->
  <rect x="200" y="760" width="300" height="60" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="1.5"/>
  <text x="350" y="785" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BLAKE3 token verify (auth.rs)</text>
  <text x="350" y="805" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="11">recompute token; compare to received token</text>

  <!-- Final Split -->
  <line x1="350" y1="820" x2="350" y2="840" stroke="#3A3858" stroke-width="2"/>
  <line x1="280" y1="840" x2="420" y2="840" stroke="#3A3858" stroke-width="2"/>
  
  <line x1="280" y1="840" x2="280" y2="860" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="420" y1="840" x2="420" y2="860" stroke="#3A3858" stroke-width="2" marker-end="url(#arrowhead-red)"/>

  <text x="350" y="838" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="11">match?</text>

  <!-- Step 10: Result -->
  <rect x="210" y="860" width="140" height="45" rx="8" fill="#27500A" stroke="#97C459" stroke-width="1.5"/>
  <text x="280" y="880" text-anchor="middle" fill="#C0DD97" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">Authenticated</text>
  <text x="280" y="895" text-anchor="middle" fill="#97C459" font-family="JetBrains Mono, monospace" font-size="11">session opens</text>

  <rect x="350" y="860" width="140" height="45" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="1.5"/>
  <text x="420" y="880" text-anchor="middle" fill="#F7C1C1" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">Rejected</text>
  <text x="420" y="895" text-anchor="middle" fill="#F09595" font-family="JetBrains Mono, monospace" font-size="11">alert logged</text>

</svg>
