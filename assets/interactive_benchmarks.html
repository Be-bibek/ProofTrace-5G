<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: var(--font-sans, sans-serif); background: transparent; color: var(--color-text-primary); }
  h2 { font-size: 16px; font-weight: 500; text-align: center; margin: 16px 0 4px; }
  p.sub { font-size: 12px; color: var(--color-text-secondary); text-align: center; margin: 0 0 16px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--color-border-primary); font-size: 12px; cursor: pointer; background: transparent; color: var(--color-text-secondary); transition: all .2s; }
  .tab.active { background: #534AB7; border-color: #534AB7; color: #EEEDFE; }
  .chart-wrap { padding: 0 12px 8px; }
  .bar-group { display: flex; align-items: center; margin-bottom: 14px; gap: 10px; }
  .bar-label { font-size: 12px; width: 120px; text-align: right; color: var(--color-text-secondary); flex-shrink: 0; }
  .bar-track { flex: 1; height: 28px; background: var(--color-background-secondary, #f3f3f3); border-radius: 6px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 10px; font-size: 12px; font-weight: 500; transition: width 0.6s cubic-bezier(.4,0,.2,1); white-space: nowrap; }
  .bar-fill.proposed { background: #534AB7; color: #EEEDFE; }
  .bar-fill.python  { background: #D85A30; color: #FAECE7; }
  .bar-fill.existing{ background: #888780; color: #F1EFE8; }
  .legend { display: flex; gap: 20px; justify-content: center; margin: 8px 0 16px; flex-wrap: wrap; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); }
  .leg-dot { width: 12px; height: 12px; border-radius: 3px; }
  .note { font-size: 11px; color: var(--color-text-tertiary); text-align: center; padding-bottom: 12px; }
</style>
</head>
<body>
<h2>Performance benchmarks — SecureMark5G vs existing protocols</h2>
<p class="sub">Lower is better for all metrics except detection rate</p>

<div class="tabs">
  <button class="tab active" onclick="show('latency',this)">Auth latency (µs)</button>
  <button class="tab" onclick="show('memory',this)">Memory usage (KB)</button>
  <button class="tab" onclick="show('throughput',this)">Throughput (pkts/s)</button>
  <button class="tab" onclick="show('detection',this)">Attack detection rate</button>
</div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#534AB7"></div>SecureMark5G (Rust)</div>
  <div class="leg-item"><div class="leg-dot" style="background:#D85A30"></div>AES+SHA256 (Python)</div>
  <div class="leg-item"><div class="leg-dot" style="background:#888780"></div>Existing 5G-AKA protocols</div>
</div>

<div class="chart-wrap" id="chart"></div>
<div class="note" id="note">Authentication latency in microseconds — Rust's zero-copy pipeline eliminates Python's interpreter overhead</div>

<script>
const data = {
  latency: {
    note: "Authentication latency in microseconds — Rust's zero-copy pipeline eliminates Python's interpreter overhead",
    max: 100,
    reverse: false,
    unit: "µs",
    rows: [
      { label: "Registration", proposed: 12, python: 87, existing: 95 },
      { label: "Token gen", proposed: 8, python: 62, existing: 78 },
      { label: "WM embed", proposed: 5, python: 44, existing: 0 },
      { label: "Encryption", proposed: 14, python: 91, existing: 85 },
      { label: "Full handshake", proposed: 39, python: 284, existing: 258 },
    ]
  },
  memory: {
    note: "Memory usage in kilobytes per device session — critical for resource-constrained IoT hardware",
    max: 80,
    reverse: false,
    unit: "KB",
    rows: [
      { label: "Auth module", proposed: 8, python: 48, existing: 62 },
      { label: "Crypto module", proposed: 12, python: 55, existing: 70 },
      { label: "WM module", proposed: 4, python: 28, existing: 0 },
      { label: "Total session", proposed: 24, python: 131, existing: 132 },
    ]
  },
  throughput: {
    note: "Packets authenticated per second — higher is better here (chart reversed for visual consistency)",
    max: 100,
    reverse: true,
    unit: "k pkts/s",
    rows: [
      { label: "Single device", proposed: 92, python: 18, existing: 22 },
      { label: "10 devices", proposed: 88, python: 15, existing: 19 },
      { label: "100 devices", proposed: 81, python: 11, existing: 14 },
      { label: "Under attack", proposed: 74, python: 8, existing: 10 },
    ]
  },
  detection: {
    note: "Attack detection accuracy — watermark integrity check catches tampering invisible to hash-only schemes",
    max: 100,
    reverse: true,
    unit: "%",
    rows: [
      { label: "Replay attack", proposed: 100, python: 98, existing: 97 },
      { label: "Tamper attack", proposed: 97, python: 62, existing: 48 },
      { label: "Fake device", proposed: 99, python: 91, existing: 85 },
      { label: "Bit-flip noise", proposed: 94, python: 70, existing: 55 },
    ]
  }
};

function bar(val, max, cls) {
  const pct = Math.round((val / max) * 100);
  return `<div class="bar-fill ${cls}" style="width:${pct}%">${val}</div>`;
}

function show(key, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const d = data[key];
  document.getElementById('note').textContent = d.note;
  const html = d.rows.map(r => `
    <div class="bar-group">
      <div class="bar-label">${r.label}</div>
      <div style="flex:1">
        <div class="bar-track" style="margin-bottom:4px">${bar(r.proposed, d.max, 'proposed')}</div>
        <div class="bar-track" style="margin-bottom:4px">${bar(r.python, d.max, 'python')}</div>
        ${r.existing ? `<div class="bar-track">${bar(r.existing, d.max, 'existing')}</div>` : ''}
      </div>
    </div>
  `).join('');
  document.getElementById('chart').innerHTML = html;
}

show('latency', document.querySelector('.tab.active'));
</script>
</body>
</html>
