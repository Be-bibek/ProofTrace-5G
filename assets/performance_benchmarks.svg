<svg width="800" viewBox="0 0 800 700" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SecureMark5G Performance Benchmarks — Auth Latency</title>
  <desc>Performance comparison: SecureMark5G (Rust) vs AES+SHA256 (Python) vs existing 5G-AKA protocols</desc>

  <!-- Background -->
  <rect width="800" height="700" fill="#0F0F1A" rx="12"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#E2E0F0" font-family="JetBrains Mono, monospace" font-size="24" font-weight="600">Performance Benchmarks</text>
  <text x="400" y="75" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="14">Authentication latency in microseconds · Lower is better</text>

  <!-- Legend -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#534AB7"/>
    <text x="25" y="14" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="16">SecureMark5G (Rust)</text>
    
    <rect x="250" y="0" width="18" height="18" rx="4" fill="#D85A30"/>
    <text x="275" y="14" fill="#FAECE7" font-family="JetBrains Mono, monospace" font-size="16">AES+SHA256 (Python)</text>
    
    <rect x="480" y="0" width="18" height="18" rx="4" fill="#888780"/>
    <text x="505" y="14" fill="#E0DED6" font-family="JetBrains Mono, monospace" font-size="16">Existing 5G-AKA</text>
  </g>

  <!-- Grid lines -->
  <g transform="translate(0, 50)">
    <line x1="140" y1="120" x2="760" y2="120" stroke="#2A2840" stroke-width="1"/>
    <line x1="140" y1="200" x2="760" y2="200" stroke="#2A2840" stroke-width="1"/>
    <line x1="140" y1="280" x2="760" y2="280" stroke="#2A2840" stroke-width="1"/>
    <line x1="140" y1="360" x2="760" y2="360" stroke="#2A2840" stroke-width="1"/>
    <line x1="140" y1="440" x2="760" y2="440" stroke="#2A2840" stroke-width="1"/>
    <line x1="140" y1="520" x2="760" y2="520" stroke="#3A3858" stroke-width="2"/>

    <!-- Y-axis labels -->
    <text x="130" y="525" text-anchor="end" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="14">0</text>
    <text x="130" y="445" text-anchor="end" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="14">75</text>
    <text x="130" y="365" text-anchor="end" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="14">150</text>
    <text x="130" y="285" text-anchor="end" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="14">225</text>
    <text x="130" y="205" text-anchor="end" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="14">300</text>

    <!-- Group 1: Registration -->
    <rect x="175" y="504" width="35" height="16" rx="4" fill="#534AB7"/>
    <rect x="220" y="404" width="35" height="116" rx="4" fill="#D85A30"/>
    <rect x="265" y="394" width="35" height="126" rx="4" fill="#888780"/>
    <text x="237" y="555" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">Registration</text>
    <text x="192" y="495" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="13">12µs</text>
    <text x="237" y="395" text-anchor="middle" fill="#FAECE7" font-family="JetBrains Mono, monospace" font-size="13">87µs</text>
    <text x="282" y="385" text-anchor="middle" fill="#E0DED6" font-family="JetBrains Mono, monospace" font-size="13">95µs</text>

    <!-- Group 2: Token gen -->
    <rect x="330" y="509" width="35" height="11" rx="4" fill="#534AB7"/>
    <rect x="375" y="437" width="35" height="83" rx="4" fill="#D85A30"/>
    <rect x="420" y="416" width="35" height="104" rx="4" fill="#888780"/>
    <text x="392" y="555" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">Token gen</text>
    <text x="347" y="500" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="13">8µs</text>
    <text x="392" y="428" text-anchor="middle" fill="#FAECE7" font-family="JetBrains Mono, monospace" font-size="13">62µs</text>
    <text x="437" y="407" text-anchor="middle" fill="#E0DED6" font-family="JetBrains Mono, monospace" font-size="13">78µs</text>

    <!-- Group 3: WM embed -->
    <rect x="485" y="513" width="35" height="7" rx="4" fill="#534AB7"/>
    <rect x="530" y="461" width="35" height="59" rx="4" fill="#D85A30"/>
    <text x="525" y="555" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">WM embed</text>
    <text x="502" y="504" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="13">5µs</text>
    <text x="547" y="452" text-anchor="middle" fill="#FAECE7" font-family="JetBrains Mono, monospace" font-size="13">44µs</text>

    <!-- Group 4: Encryption -->
    <rect x="610" y="501" width="35" height="19" rx="4" fill="#534AB7"/>
    <rect x="655" y="399" width="35" height="121" rx="4" fill="#D85A30"/>
    <rect x="700" y="407" width="35" height="113" rx="4" fill="#888780"/>
    <text x="672" y="555" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">Encryption</text>
    <text x="627" y="492" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="13">14µs</text>
    <text x="672" y="390" text-anchor="middle" fill="#FAECE7" font-family="JetBrains Mono, monospace" font-size="13">91µs</text>
    <text x="717" y="398" text-anchor="middle" fill="#E0DED6" font-family="JetBrains Mono, monospace" font-size="13">85µs</text>
  </g>

  <!-- Bottom Annotation -->
  <text x="400" y="640" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">🚀 7.3× Speedup | 5.5× Memory Savings | 97% Accuracy</text>
  <text x="400" y="670" text-anchor="middle" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="14">Rust zero-copy pipeline eliminates interpreter overhead entirely</text>
</svg>
