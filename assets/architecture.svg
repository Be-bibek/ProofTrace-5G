<svg width="800" viewBox="0 0 800 650" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SecureMark5G System Architecture</title>
  <desc>IoT device layer → 5G channel → Server verification layer with Rust core engine</desc>

  <!-- Background -->
  <rect width="800" height="650" fill="#0D0D18" rx="12"/>

  <!-- ===== LAYER 1: IoT Device ===== -->
  <rect x="30" y="28" width="740" height="186" rx="12" fill="#0A3528" stroke="#5DCAA5" stroke-width="1.5"/>
  <text x="400" y="58" text-anchor="middle" fill="#9FE1CB" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">IoT device layer</text>
  <text x="400" y="82" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="14">runs on embedded hardware — Raspberry Pi, ESP32, any Linux device</text>

  <!-- Sensor data box -->
  <rect x="60" y="104" width="148" height="90" rx="8" fill="#0D4438" stroke="#5DCAA5" stroke-width="1"/>
  <text x="134" y="134" text-anchor="middle" fill="#9FE1CB" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">Sensor data</text>
  <text x="134" y="156" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="13">TEMP, GPS</text>
  <text x="134" y="174" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="13">raw readings</text>

  <!-- Arrow -->
  <line x1="208" y1="149" x2="230" y2="149" stroke="#5DCAA5" stroke-width="1.5"/>
  <polygon points="226,142 242,149 226,156" fill="#5DCAA5"/>

  <!-- Watermark embed box -->
  <rect x="242" y="104" width="148" height="90" rx="8" fill="#2A2478" stroke="#AFA9EC" stroke-width="1"/>
  <text x="316" y="134" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">Watermark embed</text>
  <text x="316" y="156" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="13">device fingerprint</text>
  <text x="316" y="174" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="13">invisible stego</text>

  <!-- Arrow -->
  <line x1="390" y1="149" x2="412" y2="149" stroke="#AFA9EC" stroke-width="1.5"/>
  <polygon points="408,142 424,149 408,156" fill="#AFA9EC"/>

  <!-- BLAKE3 token box -->
  <rect x="424" y="104" width="148" height="90" rx="8" fill="#2A2478" stroke="#AFA9EC" stroke-width="1"/>
  <text x="498" y="130" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">BLAKE3 token</text>
  <text x="498" y="150" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="13">hash(data + wm)</text>
  <text x="498" y="168" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="13">+ replay nonce</text>

  <!-- Arrow -->
  <line x1="572" y1="149" x2="594" y2="149" stroke="#F0997B" stroke-width="1.5"/>
  <polygon points="590,142 606,149 590,156" fill="#F0997B"/>

  <!-- ChaCha20 encrypt box -->
  <rect x="606" y="104" width="148" height="90" rx="8" fill="#4A1A0A" stroke="#F0997B" stroke-width="1"/>
  <text x="680" y="134" text-anchor="middle" fill="#F5C4B3" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">ChaCha20</text>
  <text x="680" y="156" text-anchor="middle" fill="#F0997B" font-family="JetBrains Mono, monospace" font-size="13">encrypt</text>
  <text x="680" y="174" text-anchor="middle" fill="#F0997B" font-family="JetBrains Mono, monospace" font-size="13">AEAD sealed</text>

  <!-- ===== CHANNEL ===== -->
  <text x="400" y="244" text-anchor="middle" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="14">encrypted packet ↓</text>
  <line x1="400" y1="248" x2="400" y2="266" stroke="#6B6980" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="393,262 400,278 407,262" fill="#6B6980"/>

  <rect x="30" y="278" width="740" height="84" rx="10" fill="#18182A" stroke="#4B4870" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="400" y="315" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">5G transmission channel</text>
  <text x="400" y="338" text-anchor="middle" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="13">simulated via Python test harness — replay attack, tamper, packet drop</text>

  <!-- Arrow down -->
  <line x1="400" y1="368" x2="400" y2="390" stroke="#85B7EB" stroke-width="1.5"/>
  <polygon points="393,386 400,402 407,386" fill="#85B7EB"/>

  <!-- ===== LAYER 2: Server Verification ===== -->
  <rect x="30" y="402" width="740" height="150" rx="12" fill="#0A1A3C" stroke="#85B7EB" stroke-width="1.5"/>
  <text x="400" y="432" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">Server verification layer</text>
  <text x="400" y="456" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="14">cloud or edge server — validates packets in microseconds</text>

  <!-- Server boxes -->
  <rect x="52" y="476" width="140" height="64" rx="8" fill="#0C2050" stroke="#85B7EB" stroke-width="1"/>
  <text x="122" y="504" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">ChaCha20</text>
  <text x="122" y="524" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="13">decrypt</text>

  <line x1="192" y1="508" x2="214" y2="508" stroke="#85B7EB" stroke-width="1.5"/>
  <polygon points="210,501 226,508 210,515" fill="#85B7EB"/>

  <rect x="226" y="476" width="140" height="64" rx="8" fill="#0C2050" stroke="#85B7EB" stroke-width="1"/>
  <text x="296" y="504" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">Timestamp</text>
  <text x="296" y="524" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="13">replay check</text>

  <line x1="366" y1="508" x2="388" y2="508" stroke="#AFA9EC" stroke-width="1.5"/>
  <polygon points="384,501 400,508 384,515" fill="#AFA9EC"/>

  <rect x="400" y="476" width="140" height="64" rx="8" fill="#2A2478" stroke="#AFA9EC" stroke-width="1"/>
  <text x="470" y="504" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">Watermark</text>
  <text x="470" y="524" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="13">extraction</text>

  <line x1="540" y1="508" x2="562" y2="508" stroke="#5DCAA5" stroke-width="1.5"/>
  <polygon points="558,501 574,508 558,515" fill="#5DCAA5"/>

  <rect x="574" y="476" width="166" height="64" rx="8" fill="#0D4438" stroke="#5DCAA5" stroke-width="1"/>
  <text x="657" y="504" text-anchor="middle" fill="#9FE1CB" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">BLAKE3 verify</text>
  <text x="657" y="524" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="13">hash check</text>

  <!-- ===== Rust core engine band ===== -->
  <rect x="30" y="568" width="740" height="68" rx="10" fill="#4A1A0A" stroke="#F0997B" stroke-width="1.5"/>
  <text x="400" y="592" text-anchor="middle" fill="#F5C4B3" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">Rust core engine (high-performance foundation)</text>
  <text x="400" y="612" text-anchor="middle" fill="#F0997B" font-family="JetBrains Mono, monospace" font-size="14">securemark5g crate — BLAKE3 + ChaCha20 + watermark logic</text>
</svg>
