<svg width="800" viewBox="0 0 800 580" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SecureMark5G System Architecture</title>
  <desc>IoT device layer → 5G channel → Server verification layer with Rust core engine</desc>

  <!-- Background -->
  <rect width="800" height="580" fill="#0D0D18" rx="12"/>

  <!-- ===== LAYER 1: IoT Device ===== -->
  <rect x="30" y="28" width="740" height="156" rx="12" fill="#0A3528" stroke="#5DCAA5" stroke-width="1.5"/>
  <text x="400" y="52" text-anchor="middle" fill="#9FE1CB" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">IoT device layer</text>
  <text x="400" y="69" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="11">runs on embedded hardware — Raspberry Pi, ESP32, any Linux device</text>

  <!-- Sensor data box -->
  <rect x="60" y="84" width="148" height="80" rx="8" fill="#0D4438" stroke="#5DCAA5" stroke-width="1"/>
  <text x="134" y="108" text-anchor="middle" fill="#9FE1CB" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">Sensor data</text>
  <text x="134" y="126" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="10">TEMP, GPS, pressure</text>
  <text x="134" y="142" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="10">raw readings</text>

  <!-- Arrow -->
  <line x1="208" y1="124" x2="230" y2="124" stroke="#5DCAA5" stroke-width="1.5"/>
  <polygon points="226,117 242,124 226,131" fill="#5DCAA5"/>

  <!-- Watermark embed box -->
  <rect x="242" y="84" width="148" height="80" rx="8" fill="#2A2478" stroke="#AFA9EC" stroke-width="1"/>
  <text x="316" y="108" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">Watermark embed</text>
  <text x="316" y="126" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="10">device ID + nonce</text>
  <text x="316" y="142" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="10">invisible in payload</text>

  <!-- Arrow -->
  <line x1="390" y1="124" x2="412" y2="124" stroke="#AFA9EC" stroke-width="1.5"/>
  <polygon points="408,117 424,124 408,131" fill="#AFA9EC"/>

  <!-- BLAKE3 token box -->
  <rect x="424" y="84" width="148" height="80" rx="8" fill="#2A2478" stroke="#AFA9EC" stroke-width="1"/>
  <text x="498" y="105" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">BLAKE3 token</text>
  <text x="498" y="122" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="10">hash(data + wm</text>
  <text x="498" y="138" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="10">+ timestamp)</text>
  <text x="498" y="154" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="10">replay-safe nonce</text>

  <!-- Arrow -->
  <line x1="572" y1="124" x2="594" y2="124" stroke="#F0997B" stroke-width="1.5"/>
  <polygon points="590,117 606,124 590,131" fill="#F0997B"/>

  <!-- ChaCha20 encrypt box -->
  <rect x="606" y="84" width="134" height="80" rx="8" fill="#4A1A0A" stroke="#F0997B" stroke-width="1"/>
  <text x="673" y="108" text-anchor="middle" fill="#F5C4B3" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">ChaCha20</text>
  <text x="673" y="124" text-anchor="middle" fill="#F0997B" font-family="JetBrains Mono, monospace" font-size="10">encrypt</text>
  <text x="673" y="140" text-anchor="middle" fill="#F0997B" font-family="JetBrains Mono, monospace" font-size="10">AEAD sealed</text>

  <!-- ===== CHANNEL ===== -->
  <text x="400" y="214" text-anchor="middle" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="11">encrypted packet ↓</text>
  <line x1="400" y1="218" x2="400" y2="236" stroke="#6B6980" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="393,232 400,248 407,232" fill="#6B6980"/>

  <rect x="30" y="248" width="740" height="64" rx="10" fill="#18182A" stroke="#4B4870" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="400" y="275" text-anchor="middle" fill="#9A98B0" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">5G transmission channel</text>
  <text x="400" y="293" text-anchor="middle" fill="#6B6980" font-family="JetBrains Mono, monospace" font-size="10">simulated via Python test harness — replay attack injection, tamper injection, packet drop</text>

  <!-- Arrow down -->
  <line x1="400" y1="318" x2="400" y2="340" stroke="#85B7EB" stroke-width="1.5"/>
  <polygon points="393,336 400,352 407,336" fill="#85B7EB"/>

  <!-- ===== LAYER 2: Server Verification ===== -->
  <rect x="30" y="352" width="740" height="130" rx="12" fill="#0A1A3C" stroke="#85B7EB" stroke-width="1.5"/>
  <text x="400" y="376" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">Server verification layer</text>
  <text x="400" y="393" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="11">cloud or edge server — validates every packet in microseconds</text>

  <!-- Server boxes -->
  <rect x="52" y="406" width="140" height="60" rx="8" fill="#0C2050" stroke="#85B7EB" stroke-width="1"/>
  <text x="122" y="427" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">ChaCha20</text>
  <text x="122" y="443" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="10">decrypt</text>
  <text x="122" y="458" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="10">packet</text>

  <line x1="192" y1="436" x2="214" y2="436" stroke="#85B7EB" stroke-width="1.5"/>
  <polygon points="210,429 226,436 210,443" fill="#85B7EB"/>

  <rect x="226" y="406" width="140" height="60" rx="8" fill="#0C2050" stroke="#85B7EB" stroke-width="1"/>
  <text x="296" y="427" text-anchor="middle" fill="#B5D4F4" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">Timestamp</text>
  <text x="296" y="443" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="10">window check</text>
  <text x="296" y="458" text-anchor="middle" fill="#85B7EB" font-family="JetBrains Mono, monospace" font-size="10">replay blocked</text>

  <line x1="366" y1="436" x2="388" y2="436" stroke="#AFA9EC" stroke-width="1.5"/>
  <polygon points="384,429 400,436 384,443" fill="#AFA9EC"/>

  <rect x="400" y="406" width="140" height="60" rx="8" fill="#2A2478" stroke="#AFA9EC" stroke-width="1"/>
  <text x="470" y="427" text-anchor="middle" fill="#CECBF6" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">Watermark</text>
  <text x="470" y="443" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="10">extraction</text>
  <text x="470" y="458" text-anchor="middle" fill="#AFA9EC" font-family="JetBrains Mono, monospace" font-size="10">tamper detect</text>

  <line x1="540" y1="436" x2="562" y2="436" stroke="#5DCAA5" stroke-width="1.5"/>
  <polygon points="558,429 574,436 558,443" fill="#5DCAA5"/>

  <rect x="574" y="406" width="166" height="60" rx="8" fill="#0D4438" stroke="#5DCAA5" stroke-width="1"/>
  <text x="657" y="427" text-anchor="middle" fill="#9FE1CB" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">BLAKE3 verify</text>
  <text x="657" y="443" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="10">hash match</text>
  <text x="657" y="458" text-anchor="middle" fill="#5DCAA5" font-family="JetBrains Mono, monospace" font-size="10">→ authentic / reject</text>

  <!-- ===== Rust core engine band ===== -->
  <rect x="30" y="500" width="740" height="68" rx="10" fill="#4A1A0A" stroke="#F0997B" stroke-width="1.5"/>
  <text x="400" y="524" text-anchor="middle" fill="#F5C4B3" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">Rust core engine (your secret weapon)</text>
  <text x="400" y="542" text-anchor="middle" fill="#F0997B" font-family="JetBrains Mono, monospace" font-size="11">securemark5g crate — BLAKE3 + ChaCha20 + watermark logic in one zero-copy pipeline</text>
  <text x="400" y="559" text-anchor="middle" fill="#F0997B" font-family="JetBrains Mono, monospace" font-size="11">Python bindings via PyO3 · benchmarks vs AES-SHA256 Python baseline · published on crates.io</text>
</svg>
