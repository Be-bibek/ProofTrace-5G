<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00cec9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6c5ce7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2b0000" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
    <style>
      @keyframes breathe {
        0% {
          transform: scale(0.96);
          opacity: 0.85;
          filter: drop-shadow(0 0 15px rgba(0, 206, 201, 0.6));
        }
        50% {
          transform: scale(1.04);
          opacity: 1.0;
          filter: drop-shadow(0 0 30px rgba(108, 92, 231, 0.9));
        }
        100% {
          transform: scale(0.96);
          opacity: 0.85;
          filter: drop-shadow(0 0 15px rgba(0, 206, 201, 0.6));
        }
      }
      @keyframes pulse-ring {
        0% { r: 25px; opacity: 0.8; stroke-width: 2; }
        100% { r: 70px; opacity: 0; stroke-width: 6; }
      }
      @keyframes rotate-core {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .breathing-element {
        animation: breathe 4s ease-in-out infinite;
        transform-origin: center;
      }
      .ring-1 {
        animation: pulse-ring 3s cubic-bezier(0.21, 0.53, 0.56, 1) infinite;
        transform-origin: center;
      }
      .ring-2 {
        animation: pulse-ring 3s cubic-bezier(0.21, 0.53, 0.56, 1) infinite;
        animation-delay: 1.5s;
        transform-origin: center;
      }
      .core-gear {
        animation: rotate-core 20s linear infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <g transform="translate(400, 80)">
    <!-- Background Glow -->
    <circle cx="0" cy="0" r="100" fill="url(#glow)" class="breathing-element" />

    <!-- Animated Expanding Rings -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00cec9" class="ring-1" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#6c5ce7" class="ring-2" />

    <!-- Outer Tech Hexagon -->
    <polygon points="0,-55 47.6,-27.5 47.6,27.5 0,55 -47.6,27.5 -47.6,-27.5" fill="none" stroke="#520000" stroke-width="2" opacity="0.6" />
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#800000" stroke-width="1.5" stroke-dasharray="10 5" class="core-gear" />

    <!-- Breathing Core Shield/Emblem -->
    <g class="breathing-element">
      <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" fill="#11052C" stroke="#00cec9" stroke-width="3" filter="url(#blur-glow)" />
      <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" fill="#1a002c" stroke="#00cec9" stroke-width="2.5" />
      
      <!-- Inner Cybernetic Lines -->
      <path d="M-20,0 L0,-20 L20,0 L0,20 Z" fill="none" stroke="#6c5ce7" stroke-width="2" />
      <circle cx="0" cy="0" r="12" fill="#00cec9" opacity="0.9" filter="url(#blur-glow)" />
      <circle cx="0" cy="0" r="8" fill="#ffffff" />
    </g>

    <!-- Flanking Cybernetic Wings / Accents -->
    <path d="M-120,0 L-65,-25 L-55,0 L-65,25 Z" fill="url(#glow)" opacity="0.5" class="breathing-element" />
    <path d="M120,0 L65,-25 L55,0 L65,25 Z" fill="url(#glow)" opacity="0.5" class="breathing-element" />
    
    <line x1="-250" y1="0" x2="-80" y2="0" stroke="#800000" stroke-width="2" stroke-dasharray="4 8" opacity="0.7" />
    <line x1="80" y1="0" x2="250" y2="0" stroke="#800000" stroke-width="2" stroke-dasharray="4 8" opacity="0.7" />

    <circle cx="-250" cy="0" r="4" fill="#00cec9" />
    <circle cx="250" cy="0" r="4" fill="#00cec9" />
  </g>
</svg>
