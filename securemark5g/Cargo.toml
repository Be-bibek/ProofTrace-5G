[package]
name = "securemark5g"
version = "0.1.1"
edition = "2021"
authors = ["Bibek Das <bibekdas1055@gmail.com>"]
description = "Lightweight watermark-assisted cryptographic authentication for 5G IoT devices"
license = "Apache-2.0"
repository = "https://github.com/Be-bibek/ProofTrace-5G"
keywords = ["5g", "iot", "cryptography", "watermarking", "authentication"]
categories = ["cryptography", "embedded", "network-programming"]

[lib]
name = "securemark5g"
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.5"
chacha20poly1305 = "0.10"
pyo3 = { version = "0.21", features = ["extension-module"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "crypto_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
